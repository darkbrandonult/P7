<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Rule Name List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Rule Name List</h2>
    <a href="/ruleName/add" class="btn btn-primary mb-3">Add New</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruleName : ${ruleNames}">
                <td th:text="${ruleName.name}"></td>
                <td th:text="${ruleName.description}"></td>
                <td>
                    <a th:href="@{/ruleName/update/{id}(id=${ruleName.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/ruleName/delete/{id}(id=${ruleName.id})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div th:if="${#lists.isEmpty(ruleNames)}" class="alert alert-info">
        No rule names found. <a href="/ruleName/add">Add one now</a>
    </div>
    
    <a href="/" class="btn btn-secondary mt-3">Home</a>
</div>
</body>
</html>
