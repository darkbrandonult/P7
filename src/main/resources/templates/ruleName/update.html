<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Update Rule Name</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Update Rule Name</h2>
    
    <form action="#" th:action="@{/ruleName/update/{id}(id=${ruleName.id})}" th:object="${ruleName}" method="post">
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" class="form-control" 
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" 
                   id="name" />
            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                <span th:errors="*{name}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
            <textarea th:field="*{description}" class="form-control" 
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" 
                      id="description" rows="3"></textarea>
            <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback">
                <span th:errors="*{description}"></span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Update Rule Name</button>
        <a href="/ruleName/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
