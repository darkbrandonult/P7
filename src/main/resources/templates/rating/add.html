<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Add Rating</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Add New Rating</h2>
    
    <form action="#" th:action="@{/rating/validate}" th:object="${ratingDTO}" method="post">
        
        <div class="mb-3">
            <label for="moodysRating" class="form-label">Moody's Rating <span class="text-danger">*</span></label>
            <input type="text" th:field="*{moodysRating}" class="form-control" 
                   th:classappend="${#fields.hasErrors('moodysRating')} ? 'is-invalid' : ''" 
                   id="moodysRating" placeholder="Enter Moody's rating" />
            <div th:if="${#fields.hasErrors('moodysRating')}" class="invalid-feedback">
                <span th:errors="*{moodysRating}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="sandPRating" class="form-label">S&P Rating <span class="text-danger">*</span></label>
            <input type="text" th:field="*{sandPRating}" class="form-control" 
                   th:classappend="${#fields.hasErrors('sandPRating')} ? 'is-invalid' : ''" 
                   id="sandPRating" placeholder="Enter S&P rating" />
            <div th:if="${#fields.hasErrors('sandPRating')}" class="invalid-feedback">
                <span th:errors="*{sandPRating}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="fitchRating" class="form-label">Fitch Rating <span class="text-danger">*</span></label>
            <input type="text" th:field="*{fitchRating}" class="form-control" 
                   th:classappend="${#fields.hasErrors('fitchRating')} ? 'is-invalid' : ''" 
                   id="fitchRating" placeholder="Enter Fitch rating" />
            <div th:if="${#fields.hasErrors('fitchRating')}" class="invalid-feedback">
                <span th:errors="*{fitchRating}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="orderNumber" class="form-label">Order Number <span class="text-danger">*</span></label>
            <input type="number" th:field="*{orderNumber}" class="form-control" 
                   th:classappend="${#fields.hasErrors('orderNumber')} ? 'is-invalid' : ''" 
                   id="orderNumber" placeholder="Enter order number (positive)" />
            <div th:if="${#fields.hasErrors('orderNumber')}" class="invalid-feedback">
                <span th:errors="*{orderNumber}"></span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success">Add Rating</button>
        <a href="/rating/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
