<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Rating List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Rating List</h2>
    <a href="/rating/add" class="btn btn-primary mb-3">Add New</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Moody's Rating</th>
                <th>S&P Rating</th>
                <th>Fitch Rating</th>
                <th>Order Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="rating : ${ratings}">
                <td th:text="${rating.moodysRating}"></td>
                <td th:text="${rating.sandPRating}"></td>
                <td th:text="${rating.fitchRating}"></td>
                <td th:text="${rating.orderNumber}"></td>
                <td>
                    <a th:href="@{/rating/update/{id}(id=${rating.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/rating/delete/{id}(id=${rating.id})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Are you sure you want to delete this rating?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div th:if="${#lists.isEmpty(ratings)}" class="alert alert-info">
        No ratings found. <a href="/rating/add">Add one now</a>
    </div>
    
    <a href="/" class="btn btn-secondary mt-3">Home</a>
</div>
</body>
</html>
