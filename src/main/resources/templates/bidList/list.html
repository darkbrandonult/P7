<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Bid List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Bid List</h2>
    <a href="/bidList/add" class="btn btn-primary mb-3">Add New</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Account</th>
                <th>Type</th>
                <th>Bid Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="bid : ${bidLists}">
                <td th:text="${bid.account}"></td>
                <td th:text="${bid.type}"></td>
                <td th:text="${bid.bidQuantity}"></td>
                <td>
                    <a th:href="@{/bidList/update/{id}(id=${bid.bidListId})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/bidList/delete/{id}(id=${bid.bidListId})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div th:if="${#lists.isEmpty(bidLists)}" class="alert alert-info">
        No bid lists found. <a href="/bidList/add">Add one now</a>
    </div>
    
    <a href="/" class="btn btn-secondary mt-3">Home</a>
</div>
</body>
</html>
