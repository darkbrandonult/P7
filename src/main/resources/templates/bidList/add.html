<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Add Bid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Add New Bid</h2>
    
    <form action="#" th:action="@{/bidList/validate}" th:object="${bidListDTO}" method="post">
        <div class="mb-3">
            <label for="account" class="form-label">Account <span class="text-danger">*</span></label>
            <input type="text" th:field="*{account}" class="form-control" 
                   th:classappend="${#fields.hasErrors('account')} ? 'is-invalid' : ''" 
                   id="account" placeholder="Enter account" />
            <div th:if="${#fields.hasErrors('account')}" class="invalid-feedback">
                <span th:errors="*{account}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
            <input type="text" th:field="*{type}" class="form-control" 
                   th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''" 
                   id="type" placeholder="Enter type" />
            <div th:if="${#fields.hasErrors('type')}" class="invalid-feedback">
                <span th:errors="*{type}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="bidQuantity" class="form-label">Bid Quantity <span class="text-danger">*</span></label>
            <input type="number" step="0.01" th:field="*{bidQuantity}" class="form-control" 
                   th:classappend="${#fields.hasErrors('bidQuantity')} ? 'is-invalid' : ''" 
                   id="bidQuantity" placeholder="Enter bid quantity" />
            <div th:if="${#fields.hasErrors('bidQuantity')}" class="invalid-feedback">
                <span th:errors="*{bidQuantity}"></span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success">Add Bid</button>
        <a href="/bidList/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
