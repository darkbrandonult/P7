<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Add User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Add New User</h2>
    
    <form action="#" th:action="@{/user/validate}" th:object="${userDTO}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
            <input type="text" th:field="*{username}" class="form-control" 
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" 
                   id="username" placeholder="Enter username" />
            <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback">
                <span th:errors="*{username}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
            <input type="password" th:field="*{password}" class="form-control" 
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" 
                   id="password" placeholder="Enter password" />
            <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                <span th:errors="*{password}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="fullname" class="form-label">Full Name <span class="text-danger">*</span></label>
            <input type="text" th:field="*{fullname}" class="form-control" 
                   th:classappend="${#fields.hasErrors('fullname')} ? 'is-invalid' : ''" 
                   id="fullname" placeholder="Enter full name" />
            <div th:if="${#fields.hasErrors('fullname')}" class="invalid-feedback">
                <span th:errors="*{fullname}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
            <select th:field="*{role}" class="form-select" 
                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''" 
                    id="role">
                <option value="">-- Select Role --</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <div th:if="${#fields.hasErrors('role')}" class="invalid-feedback">
                <span th:errors="*{role}"></span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success">Add User</button>
        <a href="/user/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
