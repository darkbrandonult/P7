<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Update Trade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Update Trade</h2>
    
    <form action="#" th:action="@{/trade/update/{id}(id=${trade.tradeId})}" th:object="${trade}" method="post">
        <input type="hidden" th:field="*{tradeId}" />
        
        <div class="mb-3">
            <label for="account" class="form-label">Account <span class="text-danger">*</span></label>
            <input type="text" th:field="*{account}" class="form-control" 
                   th:classappend="${#fields.hasErrors('account')} ? 'is-invalid' : ''" 
                   id="account" />
            <div th:if="${#fields.hasErrors('account')}" class="invalid-feedback">
                <span th:errors="*{account}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
            <input type="text" th:field="*{type}" class="form-control" 
                   th:classappend="${#fields.hasErrors('type')} ? 'is-invalid' : ''" 
                   id="type" />
            <div th:if="${#fields.hasErrors('type')}" class="invalid-feedback">
                <span th:errors="*{type}"></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="buyQuantity" class="form-label">Buy Quantity <span class="text-danger">*</span></label>
            <input type="number" step="0.01" th:field="*{buyQuantity}" class="form-control" 
                   th:classappend="${#fields.hasErrors('buyQuantity')} ? 'is-invalid' : ''" 
                   id="buyQuantity" />
            <div th:if="${#fields.hasErrors('buyQuantity')}" class="invalid-feedback">
                <span th:errors="*{buyQuantity}"></span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Update Trade</button>
        <a href="/trade/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
