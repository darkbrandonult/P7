<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Trade List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Trade List</h2>
    <a href="/trade/add" class="btn btn-primary mb-3">Add New</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Account</th>
                <th>Type</th>
                <th>Buy Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trade : ${trades}">
                <td th:text="${trade.account}"></td>
                <td th:text="${trade.type}"></td>
                <td th:text="${trade.buyQuantity}"></td>
                <td>
                    <a th:href="@{/trade/update/{id}(id=${trade.tradeId})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/trade/delete/{id}(id=${trade.tradeId})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div th:if="${#lists.isEmpty(trades)}" class="alert alert-info">
        No trades found. <a href="/trade/add">Add one now</a>
    </div>
    
    <a href="/" class="btn btn-secondary mt-3">Home</a>
</div>
</body>
</html>
